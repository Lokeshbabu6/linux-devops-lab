name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint scripts and YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: yamllint .

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lab-app:${{ github.sha }} .

      - name: Smoke test the image
        run: docker run --rm lab-app:${{ github.sha }}
